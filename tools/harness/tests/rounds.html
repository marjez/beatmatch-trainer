<!doctype html><meta charset=utf-8><title>rounds</title>
<style>html,body{margin:0;background:#14161a}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id=f src="/index.html"></iframe>
<script type=module>
// Whole rounds through the real UI, in all three setups (natural gap, wide
// offset, fine offset): pairing stays inside the fader range, a natural round
// hides nothing, a hidden offset stays inside its band and reachable, Reveal
// lights only once a fader has moved, the clock runs only when both decks were
// played, the card shows Beatmatch PRO's score for the tempos the decks were
// really running at, and the round lands in IndexedDB with every field.
import { post, sleep, bootApp, loadCrate, waitReady, pev, tap, waitFor } from './lib.js';
const R = { rounds: [], failures: [] };
const fail = (m, extra) => R.failures.push(extra ? `${m} ${JSON.stringify(extra)}` : m);
try {
  const app = await bootApp();
  await loadCrate(app);
  await waitReady(app);
  const { w, g, bmt } = app;
  const track = id => bmt.tracks.find(t => t.id === id);

  // Drag a pitch fader to a target percentage by grabbing its knob.
  async function dragTo(id, pct) {
    const trackEl = g('faderTrack' + id), knob = g('faderKnob' + id);
    const r = trackEl.getBoundingClientRect(), kh = knob.offsetHeight, usable = r.height - kh;
    const range = +g('rangeBtn').textContent.replace(/[^\d]/g, '');
    const cur = bmt.decks[id].fader;
    const frac = v => (v + range) / (range * 2);
    const y0 = r.top + frac(cur) * usable + kh / 2, cx = r.left + r.width / 2;
    const y1 = r.top + frac(pct) * usable + kh / 2;
    pev(w, trackEl, 'pointerdown', { clientX: cx, clientY: y0 });
    const steps = 12;
    for (let i = 1; i <= steps; i++) { pev(w, trackEl, 'pointermove', { clientX: cx, clientY: y0 + (y1 - y0) * i / steps }); await sleep(4); }
    pev(w, trackEl, 'pointerup', { clientX: cx, clientY: y1 });
  }
  const readRounds = () => new Promise((res, rej) => {
    const q = w.indexedDB.open('beatmatch-trainer');
    q.onsuccess = () => { const db = q.result; const rq = db.transaction('rounds').objectStore('rounds').getAll(); rq.onsuccess = () => { db.close(); res(rq.result); }; rq.onerror = () => rej(rq.error); };
    q.onerror = () => rej(q.error);
  });
  const before = (await readRounds()).length;

  async function playRound(i, { difficulty, wide, targetErrPct }) {
    // Settings live in the sheet; set them through the real buttons.
    const diffBtn = [...g('diffSeg').children].find(b => b.dataset.diff === difficulty);
    diffBtn.click();
    const isWide = g('rangeBtn').classList.contains('wide');
    if (isWide !== wide) g('rangeBtn').click();
    await sleep(30);
    g('newPairBtn').click();
    await waitReady(app);
    const round = bmt.round, a = track(round.aId), b = track(round.bId);
    const range = wide ? 16 : 8;
    const natural = difficulty === 'natural';
    const rec = { i, difficulty, range, a: a.name, b: b.name, hidden: +round.hidden.toFixed(3), r0: +round.r0.toFixed(5) };
    if (a.id === b.id) fail('same track dealt', rec);
    if (Math.abs(a.bpm / b.bpm - 1) * 100 > range + 1e-9) fail('pair outside fader range', rec);
    if (natural) {
      // Beatmatch PRO's round: each deck at its own tempo, nothing hidden.
      if (round.r0 !== 1 || round.hidden !== 0) fail('natural round is not natural', rec);
      if (Math.abs(a.bpm / b.bpm - 1) * 100 < 0.5) fail('natural round dealt with no gap to close', rec);
    } else {
      if (Math.abs(round.r0 - a.bpm / b.bpm) > 1e-12) fail('offset round not pre-matched', rec);
      const [lo, hi] = difficulty === 'easy' ? [2, 6] : [0.5, 2.5];
      const mag = Math.abs(round.hidden);
      if (mag < lo - 1e-9 || mag > hi + 1e-9) fail('hidden outside band', rec);
      const needed = (1 / (1 + round.hidden / 100) - 1) * 100;
      if (Math.abs(needed) > range - 0.5 + 1e-9) fail('correct position not reachable', rec);
    }
    if (bmt.decks.A.fader !== 0 || bmt.decks.B.fader !== 0) fail('faders not reset', rec);
    // Reveal stays dark until a pitch fader has moved.
    if (!g('revealBtn').disabled) fail('reveal live before any fader moved', rec);

    // Odd rounds are played, so the clock runs; even ones are not, so it must not.
    const played = i % 2 === 1;
    if (played) { pev(w, g('playA'), 'pointerdown'); await sleep(120); pev(w, g('playB'), 'pointerdown'); await sleep(400); }

    // Put deck A somewhere, then deck B where its tempo equals deck A's plus a
    // deliberate error of targetErrPct, and check the reveal reports that error.
    const faderA = +(Math.random() * 2 - 1).toFixed(2);
    await dragTo('A', faderA);
    if (g('revealBtn').disabled) fail('reveal still dark after a fader moved', rec);
    const base = b.bpm * round.r0 * (1 + round.hidden / 100);          // deck B's tempo at fader 0
    const wantB = (a.bpm * (1 + bmt.decks.A.fader / 100) * (1 + targetErrPct / 100) / base - 1) * 100;
    await dragTo('B', Math.max(-range, Math.min(range, wantB)));
    await sleep(30);
    const fa = bmt.decks.A.fader, fb = bmt.decks.B.fader;
    const bpm1 = a.bpm * (1 + fa / 100), bpm2 = base * (1 + fb / 100);
    const errPct = (bpm2 / bpm1 - 1) * 100, errBpm = bpm2 - bpm1;
    // Beatmatch PRO's formula, as read from its client code.
    const pct = 100 * Math.abs(bpm1 - bpm2) / ((bpm1 + bpm2) / 2);
    const stars = 5 - Math.min(5, Math.round(pct));
    // Rates the decks are actually running at must agree with the faders.
    const rateA = bmt.rateFor('A'), rateB = bmt.rateFor('B');
    if (Math.abs(rateA - (1 + fa / 100)) > 1e-9) fail('rate A', { rateA, fa });
    if (Math.abs(rateB - round.r0 * (1 + round.hidden / 100) * (1 + fb / 100)) > 1e-9) fail('rate B', { rateB });
    if (Math.abs(b.bpm * rateB - bpm2) > 1e-9 || Math.abs(a.bpm * rateA - bpm1) > 1e-9) fail('effective BPM relation', { bpm1, bpm2 });

    g('revealBtn').click();
    await waitFor(() => g('overlay').classList.contains('show'), 3000, 'reveal');
    const shown = g('revealScore').textContent, sub = g('revealSub').textContent;
    const cls = g('revealScore').className, starsShown = g('revealStars').textContent;
    Object.assign(rec, { faderA: fa, faderB: fb, errPct: +errPct.toFixed(4), errBpm: +errBpm.toFixed(4), pct: +pct.toFixed(4), stars, shown, sub, cls, starsShown,
                         bpmOff: g('revealBpmOff').textContent, decks: g('revealDecks').textContent, detail: g('revealDetail').textContent });
    if (shown !== pct.toFixed(3)) fail('reveal score mismatch', rec);
    if (!sub.startsWith((100 - pct).toFixed(3) + '% match')) fail('reveal % match', rec);
    if (starsShown !== '★'.repeat(stars) + '☆'.repeat(5 - stars)) fail('reveal stars', rec);
    const band = stars === 5 ? 'good' : stars >= 3 ? 'mid' : 'bad';
    if (!cls.includes(band) || !g('revealStars').classList.contains(band)) fail('reveal colour band', rec);
    if (rec.bpmOff !== Math.abs(errBpm).toFixed(2) + ' BPM off') fail('reveal BPM off line', rec);
    if (!rec.decks.includes(`Original ${a.bpm.toFixed(2)}`) || !rec.decks.includes(`You ${bpm1.toFixed(2)} BPM`)
        || !rec.decks.includes(`Original ${b.bpm.toFixed(2)}`) || !rec.decks.includes(`You ${bpm2.toFixed(2)} BPM`)) fail('reveal deck columns', rec);
    if (Math.abs(errBpm) >= 0.005 && !rec.detail.includes(errBpm > 0 ? 'fast' : 'slow')) fail('reveal direction', rec);
    // The clock: only when both decks were played, and then a sane number.
    if (played !== / s$/.test(sub)) fail('reveal time shown/hidden wrongly', rec);
    if (bmt.decks.A.playing || bmt.decks.B.playing) fail('decks still playing after reveal', rec);
    await sleep(50);
    const rows = await readRounds();
    const last = rows[rows.length - 1];
    if (rows.length !== before + i + 1) fail('round not persisted', { rows: rows.length });
    for (const k of ['err', 'errBpm', 'pct', 'stars', 'difficulty', 'material', 'pitchRange', 'faderA', 'faderB', 'aName', 'bName', 'at']) {
      if (last[k] === undefined || last[k] === null) fail('persisted round missing ' + k, last);
    }
    if (last && Math.abs(last.err - errPct) > 1e-9) fail('persisted err differs', { saved: last.err, errPct });
    if (last && (Math.abs(last.pct - pct) > 1e-9 || last.stars !== stars)) fail('persisted score differs', last);
    if (last && (played ? !(last.secs > 0.3 && last.secs < 30) : last.secs !== null)) fail('persisted time', last);
    if (last && last.difficulty !== difficulty) fail('persisted difficulty', last);
    if (last && last.pitchRange !== range) fail('persisted range', last);
    if (last && (last.faderA !== fa || last.faderB !== fb)) fail('persisted faders', last);
    R.rounds.push(rec);
    // Retry keeps the pair; Next deals a new one.
    g('retryBtn').click();
    await waitReady(app);
    if (bmt.round.aId !== round.aId || bmt.round.bId !== round.bId) fail('retry changed the pair');
    if (!natural && bmt.round.hidden === round.hidden) fail('retry reused the hidden offset');
    if (!g('revealBtn').disabled) fail('reveal live straight after retry');
  }

  // Natural gap is the default setup on a fresh install.
  if (bmt.round.difficulty !== 'natural' || !g('diffSeg').querySelector('[data-diff="natural"]').classList.contains('on')) fail('default setup is not natural gap', bmt.round);

  const plan = [
    { difficulty: 'natural', wide: false, targetErrPct: 0 },
    { difficulty: 'natural', wide: false, targetErrPct: 0.4 },
    { difficulty: 'natural', wide: false, targetErrPct: -0.7 },
    { difficulty: 'natural', wide: true, targetErrPct: 2.6 },
    { difficulty: 'easy', wide: false, targetErrPct: 0 },
    { difficulty: 'easy', wide: false, targetErrPct: 0.5 },
    { difficulty: 'hard', wide: false, targetErrPct: -0.1 },
    { difficulty: 'hard', wide: false, targetErrPct: 0.03 },
    { difficulty: 'easy', wide: true, targetErrPct: 1.2 },
    { difficulty: 'hard', wide: true, targetErrPct: 0 },
  ];
  for (let i = 0; i < plan.length; i++) await playRound(i, plan[i]);

  // "From the top": 90 seconds from the first downbeat, played once, no loop.
  g('diffSeg').querySelector('[data-diff="natural"]').click();
  g('materialSeg').querySelector('[data-material="top"]').click();
  await sleep(30); g('newPairBtn').click(); await waitReady(app);
  R.top = {};
  for (const id of ['A', 'B']) {
    const t = track(id === 'A' ? bmt.round.aId : bmt.round.bId), d = bmt.decks[id];
    const bar = 240 / t.bpm, start = bmt.topStart(t);
    R.top[id] = { validSeconds: +d.validSeconds.toFixed(3), loopSeconds: d.loopSeconds, start: +start.toFixed(4), bar: +bar.toFixed(4) };
    if (d.loopSeconds !== 0) fail('top mode still loops', R.top[id]);
    if (!(d.validSeconds > 60 && d.validSeconds <= 90 + 1e-6)) fail('top mode is not 90 s', R.top[id]);
    if (start < 0 || start >= bar) fail('top mode does not start at the first downbeat', R.top[id]);
    const k = (t.anchor - start) / bar;
    if (Math.abs(k - Math.round(k)) > 1e-6) fail('top start is off the bar grid', R.top[id]);
  }
  if (bmt.round.material !== 'top') fail('round does not record its material', bmt.round);
  g('materialSeg').querySelector('[data-material="loop"]').click();
  await sleep(30); g('newPairBtn').click(); await waitReady(app);
  if (!bmt.decks.A.loopSeconds) fail('looped material did not come back');

  // Pairing exhaustively: every dealt pair over many deals is mixable at ±8.
  g('rangeBtn').click(); await sleep(20);
  if (g('rangeBtn').classList.contains('wide')) g('rangeBtn').click();
  const seen = new Set();
  for (let i = 0; i < 30; i++) {
    g('newPairBtn').click(); await waitFor(() => bmt.round, 2000, 'round');
    const r = bmt.round; seen.add(r.aId + '-' + r.bId);
    if (Math.abs(r.bpmA / r.bpmB - 1) * 100 > 8) fail('±8 deal outside range', r);
  }
  R.distinctPairsIn30Deals = seen.size;
  await waitReady(app);
  R.jsErrors = app.errs;
  R.verdict = R.failures.length ? 'FAIL' : 'PASS';
  await post(R);
} catch (e) { await post({ fatal: String(e && e.stack || e), R }); }
</script>
