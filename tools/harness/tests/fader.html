<!doctype html><meta charset=utf-8><title>fader</title>
<style>html,body{margin:0;background:#14161a}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id=f src="/index.html"></iframe>
<script>
// Drag behaviour and per-move cost. The fader must: ignore presses on the bare
// track, track the finger 1:1 once you grab the knob, and cost well under a
// frame per move. Regressions here are what "laggy" and "terrible" meant.
const post = o => fetch('/result', {method:'POST', body: JSON.stringify(o, null, 1)});
const sleep = ms => new Promise(r => setTimeout(r, ms));
setTimeout(async () => {
 try {
  const w = document.getElementById('f').contentWindow, d = w.document, g = id => d.getElementById(id);
  const errs = []; w.addEventListener('error', e => errs.push(String(e.message)));
  const t = g('faderTrackA'), r = t.getBoundingClientRect(), cx = r.left + r.width/2;
  const knob = g('faderKnobA'), kh = knob.offsetHeight;
  const knobY = () => parseFloat((knob.style.transform.match(/,\s*([-\d.]+)px/) || [0,0])[1]);
  const ev = (ty,x,y) => t.dispatchEvent(new w.PointerEvent(ty,{bubbles:true,pointerId:1,clientX:x,clientY:y}));
  const R = {};
  const before = knobY();
  ev('pointerdown',cx,r.top+5); ev('pointermove',cx,r.top+45); ev('pointerup',cx,r.top+45);
  await sleep(50);
  R.pressBareTrack_mustNotMove = +(knobY()-before).toFixed(1);
  const kTop = knobY(), grab = r.top + kTop + kh/2;
  ev('pointerdown',cx,grab);
  const cost = [];
  for (let i=1;i<=60;i++){ const t0=performance.now(); ev('pointermove',cx,grab+i*2);
    cost.push(performance.now()-t0); await sleep(8); }
  ev('pointerup',cx,grab+120);
  await sleep(50);
  R.grab120px_knobShouldMove120 = +(knobY()-kTop).toFixed(1);
  R.knobStaysUnderFinger_px = +((knobY()+kh/2) - ((grab+120)-r.top)).toFixed(1);
  cost.sort((x,y)=>x-y);
  R.perMoveCostMs = {median:+cost[30].toFixed(2), max:+cost[59].toFixed(2)};
  // Crossfader: same grab-the-knob model, horizontal. Equal-power curve.
  const xt = g('xfTrack'), xk = g('xfKnob'), xr = xt.getBoundingClientRect(), xkw = xk.offsetWidth;
  const xKnob = () => parseFloat((xk.style.transform.match(/\(\s*([-\d.]+)px/) || [0,0])[1]);
  const xev = (ty,x,y) => xt.dispatchEvent(new w.PointerEvent(ty,{bubbles:true,pointerId:2,clientX:x,clientY:y}));
  const xy = xr.top + xr.height/2, x0 = xKnob();
  xev('pointerdown', xr.left + 2, xy); xev('pointermove', xr.left + 40, xy); xev('pointerup', xr.left + 40, xy);
  await sleep(30);
  R.xf_pressBareTrack_mustNotMove = +(xKnob() - x0).toFixed(1);
  const gx = xr.left + xKnob() + xkw/2;
  xev('pointerdown', gx, xy); for (let i=1;i<=40;i++) xev('pointermove', gx + i*2, xy); xev('pointerup', gx+80, xy);
  await sleep(30);
  R.xf_grab80px_knobShouldMove80 = +(xKnob() - x0).toFixed(1);
  R.xf_position = +w.__bmt.xfade.toFixed(3);
  R.xf_gains = { A: +w.__bmt.deckGain('A').toFixed(3), B: +w.__bmt.deckGain('B').toFixed(3),
                 equalPower: +(w.__bmt.deckGain('A')**2 + w.__bmt.deckGain('B')**2).toFixed(4) };
  R.jsErrors = errs;
  R.verdict = 'bare track 0, knob moves ~120, stays under finger ~0, cost well under 16ms; xf moves 80, A²+B² == 1';
  await post(R);
 } catch(e) { await post({fatal:String(e && e.message || e)}); }
}, 2500);
</script>
