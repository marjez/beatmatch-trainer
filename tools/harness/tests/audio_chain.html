<!doctype html><meta charset=utf-8><title>audio chain</title><pre id=o>running…</pre>
<script>
// Does the mix clip? Two tracks summed at deck gain used to peak 1.64 and
// hard-clip 0.64-1.3% of samples — and clipping lands on the kick transients,
// which is what made a match hard to hear. Re-run after touching gain staging.
const post = o => fetch('/result', {method:'POST', body: JSON.stringify(o, null, 1)});
(async () => {
  const files = (await (await fetch('/files.json')).json());
  const ctx = new AudioContext();
  const bufs = [];
  for (const f of files) bufs.push(await ctx.decodeAudioData(await (await fetch('/'+f)).arrayBuffer()));
  const sr = ctx.sampleRate, N = Math.min(sr*20, ...bufs.map(b => b.length));
  const mono = b => { const L=b.getChannelData(0), R=b.numberOfChannels>1?b.getChannelData(1):L;
    const o=new Float32Array(N); for(let i=0;i<N;i++) o[i]=(L[i]+R[i])*0.5; return o; };
  const a = mono(bufs[0]), b = mono(bufs[1] || bufs[0]);
  const stat = x => { let pk=0,cl=0,sq=0;
    for(let i=0;i<x.length;i++){const v=Math.abs(x[i]); if(v>pk)pk=v; sq+=x[i]*x[i]; if(v>=0.999)cl++;}
    return {peak:+pk.toFixed(3), rmsDb:+(20*Math.log10(Math.sqrt(sq/x.length))).toFixed(1),
            clippedPct:+(100*cl/x.length).toFixed(2)}; };
  async function chain(busGain, limit) {
    const oc = new OfflineAudioContext(1, N, sr);
    const mk = src => { const bb=oc.createBuffer(1,N,sr); bb.getChannelData(0).set(src); return bb; };
    const bus = oc.createGain(); bus.gain.value = busGain;
    let tail = bus;
    if (limit) { const l=oc.createDynamicsCompressor();
      l.threshold.value=-1.5; l.knee.value=0; l.ratio.value=20; l.attack.value=0.002; l.release.value=0.12;
      bus.connect(l); tail=l; }
    tail.connect(oc.destination);
    for (const sig of [a,b]) { const s=oc.createBufferSource(); s.buffer=mk(sig);
      const g=oc.createGain(); g.gain.value=0.85; s.connect(g); g.connect(bus); s.start(0); }
    return (await oc.startRendering()).getChannelData(0);
  }
  await post({
    trackA: stat(a), trackB: stat(b),
    noHeadroom_theOldBug: stat(await chain(1.0, false)),
    shippingChain_busHalfPlusLimiter: stat(await chain(0.5, true)),
    verdict: 'shippingChain clippedPct must be 0.00',
  });
})().catch(e => post({fatal: String(e && e.message || e)}));
</script>
