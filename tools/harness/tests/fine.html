<!doctype html><meta charset=utf-8><title>fine</title>
<style>html,body{margin:0;background:#14161a}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id=f src="/index.html"></iframe>
<script type=module>
// Can a thumb actually place the fader accurately enough to score well?
//
// Measured on a phone-sized screen: at ±8% one pixel of fader is 0.040 BPM
// and the "locked" band of 0.05 BPM is 1.3 PIXELS. That is why the app was
// much harder to do well on than it should be. Fine mode maps the whole
// fader to ±1% around where the deck sits. This checks the resolution really
// improves, that engaging it does not move the deck, and that releasing
// re-centres without changing the pitch.
import { post, sleep, bootApp, waitFor, pev, stats } from './lib.js';
const R = { failures: [] };
const fail = (m, x) => R.failures.push(x ? `${m} ${JSON.stringify(x)}` : m);
try {
  const app = await bootApp();
  const { w, g, bmt } = app;
  g('beatsBtn').click();
  await waitFor(() => bmt.tracks.length >= 11, 30000, 'beats');
  await waitFor(() => bmt.round && bmt.decks.A.ready && bmt.decks.B.ready, 40000, 'ready');
  const track = bmt.tracks.find(t => t.id === bmt.round.aId);

  const trackEl = g('faderTrackA'), knob = g('faderKnobA');
  const r = trackEl.getBoundingClientRect(), kh = knob.offsetHeight, cx = r.left + r.width / 2;
  const knobY = () => parseFloat((knob.style.transform.match(/,\s*([-\d.]+)px/) || [0, 0])[1]);
  const drag = async (px) => {
    const y0 = r.top + knobY() + kh / 2;
    pev(w, trackEl, 'pointerdown', { clientX: cx, clientY: y0 });
    for (let i = 1; i <= 10; i++) { pev(w, trackEl, 'pointermove', { clientX: cx, clientY: y0 + px * i / 10 }); await sleep(4); }
    pev(w, trackEl, 'pointerup', { clientX: cx, clientY: y0 + px });
    await sleep(20);
  };
  const bpmPerPx = async () => {
    const before = bmt.decks.A.fader;
    await drag(20);
    const after = bmt.decks.A.fader;
    return Math.abs((after - before) / 100 * track.bpm) / 20;
  };

  R.coarse = { bpmPerPx: +(await bpmPerPx()).toFixed(4) };
  R.coarse.pxFor005 = +(0.05 / R.coarse.bpmPerPx).toFixed(1);

  // Engaging fine must not move the deck.
  const before = bmt.decks.A.fader, rateBefore = bmt.rateFor('A');
  g('fineBtn').click();
  await sleep(30);
  R.engage = { faderBefore: before, faderAfter: bmt.decks.A.fader, rateMoved: +(bmt.rateFor('A') - rateBefore).toFixed(9) };
  if (bmt.decks.A.fader !== before || R.engage.rateMoved !== 0) fail('engaging fine moved the deck', R.engage);
  if (!bmt.fineMode) fail('fine mode did not engage');

  R.fine = { bpmPerPx: +(await bpmPerPx()).toFixed(4) };
  R.fine.pxFor005 = +(0.05 / R.fine.bpmPerPx).toFixed(1);
  R.improvement = +(R.coarse.bpmPerPx / R.fine.bpmPerPx).toFixed(1);
  if (!(R.improvement > 5)) fail('fine mode is not meaningfully finer', R);
  if (!(R.fine.pxFor005 >= 6)) fail('0.05 BPM is still under 6 px in fine mode', R.fine);

  // Releasing re-centres the scale without changing the pitch.
  const v = bmt.decks.A.fader, rate2 = bmt.rateFor('A');
  await drag(5);
  const after2 = bmt.decks.A.fader;
  R.recentre = { knobAfterRelease: Math.round(knobY()), usablePx: Math.round(r.height - kh),
                 centredWithin: Math.abs(knobY() - (r.height - kh) / 2) };
  if (R.recentre.centredWithin > 3) fail('the knob did not re-centre on release', R.recentre);
  if (after2 === v) fail('the drag did not change the pitch at all', { v, after2 });

  // And a full-travel drag in fine mode must stay inside ±1% of where it began.
  const start = bmt.decks.A.fader;
  await drag(-(r.height - kh));
  R.fullTravel = { from: start, to: bmt.decks.A.fader, movedPct: +(bmt.decks.A.fader - start).toFixed(3) };
  if (Math.abs(R.fullTravel.movedPct) > 1.05) fail('fine travel exceeded ±1%', R.fullTravel);

  // Leaving fine mode must not move the deck either.
  const v3 = bmt.decks.A.fader;
  g('fineBtn').click(); await sleep(30);
  if (bmt.decks.A.fader !== v3) fail('leaving fine mode moved the deck', { v3, now: bmt.decks.A.fader });

  R.jsErrors = app.errs;
  R.verdict = R.failures.length ? 'FAIL' : 'PASS';
  await post(R);
} catch (e) { await post({ fatal: String(e && e.stack || e), R }); }
</script>
