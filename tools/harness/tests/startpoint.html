<!doctype html><meta charset=utf-8><title>startpoint</title>
<style>html,body{margin:0;background:#14161a}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id=f src="/index.html"></iframe>
<script type=module>
// Does a deck start where the beat is RUNNING? "Is there a kick at t=0" was
// not enough — a track can open with one hit and then a pad, and a phrase can
// be the last one before a breakdown. This counts kicks over the first 8
// seconds of every track in the crate and compares with the beats the tempo
// says should be there.
import { post, sleep, bootApp, loadCrate, waitReady, tapMaster, pev, waitFor } from './lib.js';
const R = { tracks: [], failures: [] };
const fail = (m, x) => R.failures.push(x ? `${m} ${JSON.stringify(x)}` : m);
try {
  const app = await bootApp(); await loadCrate(app); await waitReady(app);
  const { w, g, bmt } = app; const ctx = bmt.ctx;
  pev(w, g('playA'), 'pointerdown'); await sleep(50); pev(w, g('playA'), 'pointerdown'); await sleep(100);
  const rec = await tapMaster(app);
  const SPAN = 8;
  const seen = new Set();
  for (let n = 0; n < 60 && seen.size < bmt.tracks.length; n++) {
    g('newPairBtn').click(); await waitReady(app);
    for (const id of ['A', 'B']) {
      const tr = bmt.tracks.find(t => t.id === (id === 'A' ? bmt.round.aId : bmt.round.bId));
      if (seen.has(tr.name)) continue; seen.add(tr.name);
      bmt.decks[id].offset = 0; rec.clear(); await sleep(80);
      pev(w, g('play' + id), 'pointerdown');
      const sched = bmt.decks[id].mark;
      await sleep(SPAN * 1000 + 300); await rec.settle(sched + SPAN);
      const rate = bmt.rateFor(id);
      const period = 60 / tr.bpm / rate;
      const g2 = rec.gridScore(sched, sched + SPAN, period);
      const rec1 = { track: tr.name.slice(0, 34), start: +bmt.phraseStart(tr, 600).toFixed(1), bpm: tr.bpm,
                     beats: g2.beats, onGridHits: g2.onGridHits, onOffRatio: g2.ratio,
                     hitRate: +(g2.onGridHits / g2.beats).toFixed(2), firstKickMs: g2.firstMs };
      R.tracks.push(rec1);
      // A beat that is running puts far more kick-band energy on the grid than
      // between it, on most beats of the window.
      if (!(g2.ratio > 1.4) || g2.onGridHits < g2.beats * 0.7) fail('the beat does not run on the grid from the start point', rec1);
      // Phase: the first strong kick must land ON the grid. Not necessarily on
      // beat 1 — plenty of bars open with something other than a kick — but
      // its distance to the nearest predicted beat must be small. A 250 ms
      // phase error, which the old count-based check passed, fails here.
      const P = period * 1000;
      const phaseErr = g2.firstMs === null ? null : Math.abs(g2.firstMs - Math.round(g2.firstMs / P) * P);
      rec1.phaseErrMs = phaseErr === null ? null : +phaseErr.toFixed(1);
      // 35 ms: the bug this guards against is a quarter-second phase error (a
      // deck starting between beats). Two transients read as one drum up to
      // ~20-50 ms apart, so anything inside that window is not what a listener
      // would call out of phase — and the grid analysis itself carries a few
      // ms. A tighter limit just failed good tracks on measurement noise.
      if (phaseErr === null || phaseErr > 35) fail('playback does not begin on the beat grid', rec1);
      pev(w, g('play' + id), 'pointerdown'); await sleep(120);
    }
  }
  R.covered = seen.size;
  R.jsErrors = app.errs;
  R.verdict = R.failures.length ? 'FAIL' : 'PASS';
  rec.disconnect();
  await post(R);
} catch (e) { await post({ fatal: String(e && e.stack || e), R }); }
</script>
