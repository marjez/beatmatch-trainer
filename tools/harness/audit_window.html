<!doctype html><meta charset=utf-8><title>audit window</title><pre id=o>running…</pre>
<script type=module>
// Is a track any good to BEATMATCH AGAINST — for the whole round, not just at
// the drop-in point?
//
// startpoint.html only ever looked at the first 8 seconds from the cue. A
// round runs for up to 180 s, so a track that drops into a breakdown, an
// ambient passage or a half-time section leaves you matching against nothing
// for a minute at a time. That is what "the demo tracks are really bad for
// beatmatching" means, and nothing in the suite measured it.
//
// For each track this walks the whole 180 s window in 8 s blocks and asks of
// each block: does the kick band carry more energy ON the beats than between
// them? It reports the fraction of the window where the beat is running, and
// the longest stretch where it is not.
//
//   mount the slices at /crate/ (files.json + crate.json with bpm/anchor/cues)
const post = o => fetch('/result', { method: 'POST', body: JSON.stringify(o, null, 1) });
const log = s => { document.getElementById('o').textContent += '\n' + s; };
const WINDOW_S = 180, BLOCK_S = 8;

function kickEnvelope(data, sr) {
  const w = 2 * Math.PI * 120 / sr, q = 0.7;
  const alpha = Math.sin(w) / (2 * q), cosw = Math.cos(w), a0 = 1 + alpha;
  const b = [(1 - cosw) / 2 / a0, (1 - cosw) / a0, (1 - cosw) / 2 / a0];
  const a = [(-2 * cosw) / a0, (1 - alpha) / a0];
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  const hop = Math.round(sr / 1000), env = new Float32Array(Math.floor(data.length / hop));
  let acc = 0, n = 0, k = 0;
  for (let i = 0; i < data.length; i++) {
    const y = b[0] * data[i] + b[1] * x1 + b[2] * x2 - a[0] * y1 - a[1] * y2;
    x2 = x1; x1 = data[i]; y2 = y1; y1 = y;
    acc += y * y; n++;
    if (n === hop) { env[k++] = Math.sqrt(acc / n); acc = 0; n = 0; }
  }
  env.hopS = hop / sr;              // NOT 1 ms — 44/44100 s. See CLAUDE.md.
  return env;
}

try {
  const files = await (await fetch('/crate/files.json')).json();
  const manifest = await (await fetch('/crate/crate.json')).json();
  const byFile = new Map(manifest.tracks.map(t => [t.file, t]));
  const ctx = new AudioContext();
  const out = [];
  for (const f of files) {
    const meta = byFile.get(f);
    if (!meta) { log(`SKIP ${f}`); continue; }
    const res = await fetch('/crate/' + encodeURIComponent(f));
    if (!res.ok) { log(`MISSING ${f.slice(0, 44)} (HTTP ${res.status})`); continue; }
    let buf;
    try { buf = await ctx.decodeAudioData(await res.arrayBuffer()); }
    catch (err) { log(`UNDECODABLE ${f.slice(0, 44)}`); continue; }
    const sr = buf.sampleRate;
    const L = buf.getChannelData(0);
    const R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
    const mono = new Float32Array(buf.length);
    for (let i = 0; i < buf.length; i++) mono[i] = (L[i] + R[i]) * 0.5;

    // Where the app will actually start: the first cue at or after its 30 s
    // target, snapped to the phrase grid — the same rule as phraseStart().
    const beat = 60 / meta.bpm, phrase = 16 * beat;
    const target = 30;
    const cues = (meta.cues || []).filter(c => c >= target - phrase / 2);
    const anchor = meta.anchor || 0;
    const snap = t => anchor + Math.ceil((t - anchor) / phrase - 1e-6) * phrase;
    const start = cues.length ? snap(Math.min(...cues)) : target;

    const env = kickEnvelope(mono, sr), hopMs = env.hopS * 1000;
    const startI = Math.round(start * 1000 / hopMs);
    const available = Math.min(WINDOW_S, buf.duration - start);
    const blocks = Math.floor(available / BLOCK_S);
    const P = beat * 1000 / hopMs, tol = 15 / hopMs;
    const mean = c => {
      let s = 0, n = 0;
      for (let i = Math.round(c - tol); i <= Math.round(c + tol); i++) {
        const j = startI + i;
        if (j >= 0 && j < env.length) { s += env[j]; n++; }
      }
      return n ? s / n : 0;
    };
    // Blocks must be measured ON THE BEAT GRID. An 8 s block is not a whole
    // number of beats (16.27 at 122 BPM), so marching k*period from each
    // block's start drifted a quarter-beat further off with every block and
    // reported a running beat as absent. This snaps every probe to the
    // track's own grid.
    const run = [];
    for (let bl = 0; bl < blocks; bl++) {
      const blockStartS = start + bl * BLOCK_S;
      const beats = Math.floor(BLOCK_S / beat);
      let on = 0, off = 0, hits = 0;
      for (let k = 0; k < beats; k++) {
        const beatS = anchor + Math.round((blockStartS + k * beat - anchor) / beat) * beat;
        const e = mean(beatS * 1000 / hopMs - startI), o = mean((beatS + beat / 2) * 1000 / hopMs - startI);
        on += e; off += o;
        if (e > o * 1.3) hits++;
      }
      run.push(on / (off || 1e-9) > 1.4 && hits >= beats * 0.7);
    }
    let longestGap = 0, cur = 0, firstGapAt = null;
    run.forEach((ok, i) => {
      if (ok) cur = 0;
      else { cur++; if (cur > longestGap) { longestGap = cur; firstGapAt = (i - cur + 1) * BLOCK_S; } }
    });
    const good = run.filter(Boolean).length;

    // The LOOP: the longest unbroken run of beat, measured over the whole
    // slice rather than the 180 s window, trimmed to a whole number of 4-bar
    // phrases. Real tracks have breakdowns — almost none of them give you
    // three unbroken minutes — so the deck loops this instead of playing
    // through whatever comes next.
    const phraseS = 16 * beat;
    // Absolute lookup: the beat grid starts at the track's ANCHOR, not at the
    // first sample. Scanning from zero put the windows between the beats on
    // every track whose downbeat is not at 0, which made tracks that run a
    // beat the whole way through report no loop at all.
    const meanAbs = c => {
      let s2 = 0, n2 = 0;
      for (let i = Math.round(c - tol); i <= Math.round(c + tol); i++) {
        if (i >= 0 && i < env.length) { s2 += env[i]; n2++; }
      }
      return n2 ? s2 / n2 : 0;
    };
    const scanBlocks = Math.floor((buf.duration - anchor - 1) / BLOCK_S);
    const ok2 = [];
    for (let bl = 0; bl < scanBlocks; bl++) {
      const blockStartS = anchor + bl * BLOCK_S;
      const beats = Math.floor(BLOCK_S / beat);
      let on = 0, off = 0, hits = 0;
      for (let k = 0; k < beats; k++) {
        // Snap to the nearest beat of the track's own grid.
        const beatS = anchor + Math.round((blockStartS + k * beat - anchor) / beat) * beat;
        const e = meanAbs(beatS * 1000 / hopMs), o = meanAbs((beatS + beat / 2) * 1000 / hopMs);
        on += e; off += o;
        if (e > o * 1.3) hits++;
      }
      ok2.push(on / (off || 1e-9) > 1.4 && hits >= beats * 0.7);
    }
    let bestFrom = 0, bestLen = 0, curFrom = 0, curLen = 0;
    ok2.forEach((good2, i) => {
      if (good2) { if (curLen === 0) curFrom = i; curLen++; if (curLen > bestLen) { bestLen = curLen; bestFrom = curFrom; } }
      else curLen = 0;
    });
    // Snap the run to phrase boundaries measured from the track's own anchor.
    const runFrom = anchor + bestFrom * BLOCK_S, runTo = anchor + (bestFrom + bestLen) * BLOCK_S;
    const up = t => anchor + Math.ceil((t - anchor) / phraseS - 1e-6) * phraseS;
    const down = t => anchor + Math.floor((t - anchor) / phraseS + 1e-6) * phraseS;
    let loopStart = up(runFrom), loopEnd = down(runTo);
    const phrases = Math.max(0, Math.round((loopEnd - loopStart) / phraseS));
    if (phrases > 48) loopEnd = loopStart + 48 * phraseS;      // 192 bars is plenty
    const rec = { file: f, bpm: meta.bpm, startS: +start.toFixed(1), windowS: +available.toFixed(0),
                  blocks: run.length, runningPct: Math.round(100 * good / run.length),
                  longestGapS: longestGap * BLOCK_S, firstGapAtS: firstGapAt,
                  loopStart: +loopStart.toFixed(3), loopEnd: +loopEnd.toFixed(3),
                  loopPhrases: Math.min(phrases, 48), loopS: +(Math.min(phrases, 48) * phraseS).toFixed(1) };
    out.push(rec);
    log(`${String(rec.runningPct).padStart(3)}% beat · gap ${String(rec.longestGapS).padStart(3)}s · loop ${String(rec.loopS).padStart(5)}s (${rec.loopPhrases} phrases) · ${f.slice(0, 38)}`);
  }
  await post({ measurementOnly: true, tracks: out });
} catch (e) { await post({ measurementOnly: true, fatal: String(e && e.stack || e) }); }
</script>
