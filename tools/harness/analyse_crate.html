<!doctype html><meta charset=utf-8><title>analyse</title><pre id=o>running…</pre>
<script type=module>
// Beat-grid analysis for tracks that have no Rekordbox grid: BPM from the
// app's own vendored detector, then refined by fitting a grid to a low-band
// onset envelope over two minutes, then the beat phase and a best-effort
// downbeat. Serve the project root with the tracks mounted at /crate/ and
// files.json listing them; posts {file, bpm, anchor, confidence} per track.
import { guess } from '/js/vendor/web-audio-beat-detector.mjs';
const post = o => fetch('/result', { method: 'POST', body: JSON.stringify(o, null, 1) });
const log = s => { document.getElementById('o').textContent += '\n' + s; };
try {
  const files = await (await fetch('/crate/files.json')).json();
  const ctx = new OfflineAudioContext(1, 1, 44100);
  const out = [];
  for (const f of files) {
    const ab = await (await fetch('/crate/' + encodeURIComponent(f))).arrayBuffer();
    const buf = await new AudioContext().decodeAudioData(ab);
    const sr = buf.sampleRate, dur = buf.duration;
    const offset = dur > 90 ? Math.min(30, dur * 0.25) : 0;
    let bpm0 = null;
    try { const r = await guess(buf, offset, Math.min(60, dur - offset), { minTempo: 80, maxTempo: 159 }); bpm0 = typeof r === 'number' ? r : (r?.bpm ?? r?.tempo); } catch {}
    // Low-band onset envelope at 1 ms resolution over the analysed span.
    // The whole track (capped), not the first 150 s: a slow builder's first
    // sustained phrase can be minutes in, and a track with no cue at all falls
    // back to the app's blind 30 s guess.
    const span = Math.min(420, dur - 5), n = Math.floor(span * sr);
    const frame = Math.round(sr / 1000), frames = Math.floor(n / frame);
    const frameS = frame / sr;               // NOT 1 ms: 44/44100 s; converting back with 1 ms biased BPM by 0.23%
    // Two onset envelopes: the kick band, and everything. A sidechained or soft
    // kick barely moves the low band while the beat is plainly running — two of
    // sixteen demo tracks found no drop-in point at all on the low band alone.
    const envelope = async (filter) => {
      const oc = new OfflineAudioContext(1, n, sr);
      const src = oc.createBufferSource(); src.buffer = buf;
      let tail = src;
      if (filter) { const f = oc.createBiquadFilter(); f.type = filter.type; f.frequency.value = filter.hz; f.Q.value = 0.9; src.connect(f); tail = f; }
      tail.connect(oc.destination); src.start(0);
      const d = (await oc.startRendering()).getChannelData(0);
      const env = new Float32Array(frames);
      for (let i = 0; i < frames; i++) { let e = 0; for (let k = 0; k < frame; k++) { const v = d[i * frame + k]; e += v * v; } env[i] = Math.sqrt(e / frame); }
      const on = new Float32Array(frames);
      for (let i = 1; i < frames; i++) on[i] = Math.max(0, env[i] - env[i - 1]);
      let peak = 0; for (let i = 0; i < frames; i++) if (on[i] > peak) peak = on[i];
      if (peak > 0) for (let i = 0; i < frames; i++) on[i] /= peak;      // normalised, so the two are comparable
      return { onset: on, env };
    };
    const { onset: onsetLow, env: envLow } = await envelope({ type: 'lowpass', hz: 150 });
    const onset = onsetLow;                  // the grid fit still follows the kick
    // Grid fit: period in ms around the detector's guess, ±1.5%, best phase per period.
    const fit = (bpmGuess) => {
      let best = { score: -1 };
      const p0 = 60 / bpmGuess / frameS;   // beat period in frames
      for (let p = p0 * 0.985; p <= p0 * 1.015; p += p0 * 0.00005) {
        const beats = Math.floor((frames - 1) / p);
        for (let ph = 0; ph < p; ph += 1) {
          let s = 0;
          for (let k = 0; k < beats; k++) { const i = Math.round(ph + k * p); s += onset[i] + 0.5 * (onset[i - 1] || 0) + 0.5 * (onset[i + 1] || 0); }
          if (s > best.score) best = { score: s, p, ph, beats };
        }
      }
      return best;
    };
    const cands = bpm0 ? [bpm0] : [120, 124, 128, 132, 136];
    let best = { score: -1 };
    for (const c of cands) { const b = fit(c); if (b.score > best.score) best = b; }
    // Confidence: best phase score vs the mean over all phases at that period.
    let mean = 0; { const p = best.p, beats = best.beats; let cnt = 0; for (let ph = 0; ph < p; ph += 4) { let s = 0; for (let k = 0; k < beats; k++) { const i = Math.round(ph + k * p); s += onset[i]; } mean += s; cnt++; } mean /= cnt; }
    const bpm = +(60 / (best.p * frameS)).toFixed(2);
    // Downbeat: of the four beat phases, the one with the strongest average onset.
    let dbBest = { s: -1, k: 0 };
    for (let k = 0; k < 4; k++) { let s = 0, c = 0; for (let b = k; b < best.beats; b += 4) { s += onset[Math.round(best.ph + b * best.p)]; c++; } if (c && s / c > dbBest.s) dbBest = { s: s / c, k }; }
    const anchor = +((best.ph + dbBest.k * best.p) * frameS).toFixed(4);
    // Drop-in points. "Where the kick first appears" was not enough — a track
    // can open with one hit and then a pad, and a phrase that merely starts
    // with a beat can be the last phrase before a breakdown. A drop-in point
    // is a PHRASE BOUNDARY from which the beat RUNS for at least SUSTAIN_BARS
    // bars: ≥80% of those beats carry an onset. Every such phrase is emitted,
    // so the app can pick the first one at or after its target rather than
    // landing in an intro or a breakdown. kickIn is the first of them.
    const SUSTAIN_BARS = 8;
    const cues = [];
    let kickIn = null;
    {
      // A beat is "active" when the KICK BAND carries more energy on it than
      // between it. Counting onsets in either band called a kickless intro's
      // hats a running beat — measured on the real crate, five of sixteen
      // tracks were given cues that start in an intro. This is the same
      // on-beat-vs-off-beat test tools/harness/tests/startpoint.html judges by.
      const at = (src, i) => src[Math.max(0, Math.min(src.length - 1, Math.round(i)))];
      const around = (src, i, tolFrames) => {
        let m = 0; for (let k = -tolFrames; k <= tolFrames; k++) m = Math.max(m, at(src, i + k));
        return m;
      };
      const tol = Math.max(1, Math.round(0.015 / frameS));
      const active = [];
      for (let b = dbBest.k; b < best.beats; b++) {
        const onBeat = around(envLow, best.ph + b * best.p, tol);
        const offBeat = around(envLow, best.ph + (b + 0.5) * best.p, tol);
        active.push(onBeat > offBeat * 1.3 && onBeat > 0);
      }
      const strong = active;
      const need = SUSTAIN_BARS * 4;
      for (let ph = 0; ph + need <= active.length; ph += 16) {
        let hits = 0; for (let b = 0; b < need; b++) if (active[ph + b]) hits++;
        if (hits >= need * 0.8) {
          const t = +((best.ph + (dbBest.k + ph) * best.p) * frameS).toFixed(3);
          if (kickIn === null) kickIn = t;
          // One candidate per region is plenty; keep them ~16 bars apart.
          if (!cues.length || t - cues[cues.length - 1] > 16 * 4 * best.p * frameS) cues.push(t);
        }
      }
    }
    const rec = { file: f, duration: +dur.toFixed(1), bpmDetector: bpm0 && +bpm0.toFixed(2), bpm, anchor, kickIn, cues, confidence: +(best.score / (mean || 1)).toFixed(2) };
    out.push(rec); log(JSON.stringify(rec));
  }
  await post(out);
} catch (e) { await post({ fatal: String(e && e.stack || e) }); }
</script>
